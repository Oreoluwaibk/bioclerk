<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BioClerk Letterhead</title>
    <!--[if gte mso 9]>
      <xml>
        <w:WordDocument>
          <w:View>Print</w:View>
          <w:Zoom>100</w:Zoom>
        </w:WordDocument>
      </xml>
    <![endif]-->
    <style>
      @page {
        size: A4;
        margin: 18mm 16mm;
      }
      body {
        margin: 0;
        font-family: Calibri, Arial, sans-serif;
        color: #14231f;
        font-size: 14px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      .brand-name {
        font-size: 22px;
        font-weight: bold;
        color: #14231f;
        line-height: 1.1;
      }
      .brand-url {
        font-size: 12px;
        color: #62736e;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tagline {
        font-size: 13px;
        color: #62736e;
        text-align: right;
        line-height: 1.45;
      }
      .rule {
        border-top: 4px solid #102b26;
        font-size: 1px;
        line-height: 1px;
        height: 4px;
        margin: 18px 0 0 0;
      }
      .rule-thin {
        border-top: 3px solid #102b26;
        font-size: 1px;
        line-height: 1px;
        height: 3px;
        margin: 0 0 12px 0;
      }
      .footer {
        font-size: 13px;
        color: #62736e;
      }
      .footer strong {
        color: #14231f;
      }
      .sep {
        color: #8fa49c;
        padding: 0 10px;
      }
      .spacer {
        height: 180mm;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td width="56" valign="middle">
          <img
            src="brand/logo.png"
            width="48"
            height="48"
            alt="BioClerk"
          />
        </td>
        <td valign="middle">
          <div class="brand-name">BioClerk</div>
          <div class="brand-url">bioclerk.com</div>
        </td>
        <td class="tagline" valign="middle">
          Offline clinical dictation<br />
          Medical transcription app for clinicians · Nigeria
        </td>
      </tr>
    </table>
    <div class="rule">&nbsp;</div>
    <div class="spacer">&nbsp;</div>
    <div class="rule-thin">&nbsp;</div>
    <div class="footer">
      <strong>contact us</strong><span class="sep">|</span
      >support.bioclerk@gmail.com<span class="sep">|</span>bioclerk.com<span
        class="sep"
        >|</span
      >+234 904 295 6435
    </div>
  </body>
</html>
